<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#0d0d1a"/>
  <!-- Skull body (top dome) -->
  <ellipse cx="50" cy="44" rx="24" ry="22" fill="#e8253a"/>
  <!-- Skull jaw -->
  <rect x="33" y="56" width="34" height="16" rx="4" fill="#e8253a"/>
  <!-- Eye sockets -->
  <circle cx="41" cy="46" r="7" fill="#0d0d1a"/>
  <circle cx="59" cy="46" r="7" fill="#0d0d1a"/>
  <!-- Nose hole -->
  <ellipse cx="50" cy="56" rx="4" ry="3.5" fill="#0d0d1a"/>
  <!-- Jaw teeth gaps -->
  <rect x="39" y="64" width="5" height="7" rx="2" fill="#0d0d1a"/>
  <rect x="47.5" y="64" width="5" height="7" rx="2" fill="#0d0d1a"/>
  <rect x="56" y="64" width="5" height="7" rx="2" fill="#0d0d1a"/>
</svg>

